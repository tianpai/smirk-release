name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "main"

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: tianpai/smirk

jobs:
  validate-source:
    runs-on: ubuntu-latest

    steps:
      - name: Check source repository access
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SOURCE_REF: ${{ inputs.branch }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "::error title=Missing PRIVATE_REPO_TOKEN::Add a PRIVATE_REPO_TOKEN repository secret with read access to ${SOURCE_REPOSITORY}."
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$PRIVATE_REPO_TOKEN" | base64 | tr -d '\n')"

          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            ls-remote --exit-code "https://github.com/${SOURCE_REPOSITORY}.git" "refs/heads/${SOURCE_REF}" >/dev/null; then
            echo "::error title=Cannot access source ref::PRIVATE_REPO_TOKEN cannot read ${SOURCE_REPOSITORY}@${SOURCE_REF}, or that branch does not exist."
            exit 1
          fi

  build-mac:
    needs: validate-source
    runs-on: macos-latest

    steps:
      - name: Clone private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Build Electron app (macOS)
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  build-win:
    needs: validate-source
    runs-on: windows-latest

    steps:
      - name: Clone private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Build Electron app (Windows)
        run: npm run dist:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

  publish:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest

    steps:
      - name: Clone private repo (for version)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Get version from package.json
        id: version
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Download mac artifacts
        uses: actions/download-artifact@v5
        with:
          name: mac-artifacts
          path: dist/

      - name: Download win artifacts
        uses: actions/download-artifact@v5
        with:
          name: win-artifacts
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/*

  cleanup:
    needs: [publish]
    runs-on: ubuntu-latest

    steps:
      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
